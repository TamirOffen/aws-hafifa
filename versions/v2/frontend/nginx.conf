# Static SPA serving only.
#
# - try_files ... /index.html : standard single-page-app fallback so client
#   routes always resolve to index.html.
# - /health : a trivial 200 so this container can use the same health-check
#   path as the backend (Stage 4: one uniform target-group health check).
# - No proxy_pass anywhere: the ALB routes /api/* to the backend service.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /health {
        access_log off;
        return 200 'ok\n';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
